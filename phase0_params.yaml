# Single source of truth for the robot. SI units only. Rough starting guesses.
# Read by model/build_mjcf.py now, by the Phase 1 LQR script, and later by CAD and firmware.
meta:
  name: biped
  version: 1

sim:
  physics_dt_s: 0.002
  policy_dt_s: 0.01
  gravity_mps2: 9.81
  spawn_clearance_m: 0.002

body:
  mass_kg: 0.90
  size_m: [0.12, 0.12, 0.06]
  com_height_above_hips_m: 0.04
  inertia_kgm2: [0.00135, 0.00135, 0.00216]
  hip_separation_m: 0.14

thigh:
  mass_kg: 0.12
  length_m: 0.11
  radius_m: 0.01
  inertia_kgm2: [0.000121, 0.000121, 0.000006]

shank:
  mass_kg: 0.06
  length_m: 0.11
  radius_m: 0.008
  inertia_kgm2: [0.0000605, 0.0000605, 0.000003]

wheel:
  mass_kg: 0.12
  radius_m: 0.03
  width_m: 0.02
  inertia_kgm2: [0.000031, 0.000054, 0.000031]

joints:
  hip: {range_rad: [-1.0, 1.5]}
  knee: {range_rad: [-0.1, 2.4]}
  damping_Nms_per_rad: 0.01
  frictionloss_Nm: 0.005

leg_motor:
  gear_ratio: 9.0
  rotor_inertia_kgm2: 0.000002
  peak_torque_Nm: 3.0
  kp_Nm_per_rad: 15.0
  kv_Nms_per_rad: 0.4
  torque_constant_Nm_per_A: 0.1
  resistance_ohm: 0.3

wheel_motor:
  gear_ratio: 1.0
  rotor_inertia_kgm2: 0.00002
  peak_torque_Nm: 0.4
  torque_constant_Nm_per_A: 0.05
  resistance_ohm: 0.5

contact:
  floor_friction: [1.0, 0.005, 0.0001]
  wheel_friction: [1.0, 0.005, 0.0001]

battery:
  nominal_voltage_V: 24.0

gravity_ms2: 9.81
wheel_inertia_total_kgm2: 9.0e-5   # both wheels, solid discs: 2 * 0.5 * 0.10 kg * 0.03^2
motor_ke_vs_per_rad: 0.10          # back EMF constant, equals Kt in SI units
viscous_friction_nm_s_per_rad: 0.0 # per motor, set to 0 for the baseline check, add in step 4
yaw_body_inertia_kgm2: 0.003