# Phase 1 wheeled inverted pendulum parameters. SI units. All values are placeholders
# for a 1.5 kg class robot: replace after Phase 2 and again after weighing real parts.
# Conventions (docs/conventions.md): x forward, tilt positive leaning forward,
# wheel rotation positive when rolling forward.

# Body and drive
wheel_mass_total_kg: 0.20
wheel_radius_m: 0.03
body_mass_kg: 1.20
axle_to_com_m: 0.12
body_pitch_inertia_kgm2: 0.0025
motor_kt_nm_per_a: 0.10
winding_resistance_ohm: 2.0
battery_voltage_v: 24.0
current_limit_a: 5.0
track_width_m: 0.14

# Model
gravity_ms2: 9.81
wheel_inertia_total_kgm2: 9.0e-5       # both wheels
motor_ke_vs_per_rad: 0.10              # back EMF constant, equals Kt in SI units
viscous_friction_nm_s_per_rad: 0.001   # per motor
yaw_body_inertia_kgm2: 0.003
motor_count: 2

# Sensors
imu_height_m: 0.10              # IMU position above the axle, along the body axis
gyro_noise_rad_s: 0.005         # white noise per sample, rms
gyro_bias_rad_s: 0.02           # constant bias, about 1.1 deg/s
accel_noise_ms2: 0.05           # white noise per sample, rms
encoder_noise_rad_s: 0.05       # wheel speed noise per sample, rms

# --- Safety (Step 12) ---
fall_threshold_rad: 1.3          # PLACEHOLDER, set with src/fall_threshold.py
